<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShieldCheck | Minimalist Password Analyzer & Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- Minimal Header -->
        <header class="app-header">
            <div class="logo">
                <i class="fas fa-shield-halved logo-icon"></i>
                <span class="logo-title">ShieldCheck</span>
            </div>
            <span class="subtitle">Minimalist Password Analyzer & Generator</span>
        </header>

        <!-- Main Minimal Card -->
        <main class="main-card">
            <!-- SECTION 1: ANALYZER -->
            <section class="card-section">
                <div class="section-header">
                    <h2><i class="fas fa-magnifying-glass-chart"></i> Password Analyzer</h2>
                </div>

                <div class="input-wrapper">
                    <input type="password" id="passwordInput" placeholder="Type or paste a password..." autocomplete="off" spellcheck="false">
                    <div class="input-actions">
                        <button type="button" id="togglePasswordBtn" title="Toggle visibility">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </button>
                        <button type="button" id="copyInputBtn" title="Copy to clipboard">
                            <i class="fas fa-copy"></i>
                        </button>
                        <button type="button" id="clearInputBtn" title="Clear">
                            <i class="fas fa-xmark"></i>
                        </button>
                    </div>
                </div>

                <!-- Animated Strength Bar -->
                <div class="strength-bar-track">
                    <div id="strengthBar" class="strength-bar-fill empty"></div>
                </div>

                <!-- Key Metrics Grid -->
                <div class="metrics-grid">
                    <div class="metric-box">
                        <span class="metric-label">Strength</span>
                        <span class="metric-val" id="scoreLabel">—</span>
                    </div>
                    <div class="metric-box">
                        <span class="metric-label">Crack Time</span>
                        <span class="metric-val" id="crackTimeVal">—</span>
                    </div>
                    <div class="metric-box">
                        <span class="metric-label">Entropy</span>
                        <span class="metric-val" id="entropyVal">0 bits</span>
                    </div>
                </div>

                <!-- Requirements Checklist -->
                <div class="checklist">
                    <span class="check-pill" id="chkLength"><i class="fas fa-circle-dot"></i> 12+ chars</span>
                    <span class="check-pill" id="chkUpper"><i class="fas fa-circle-dot"></i> Uppercase</span>
                    <span class="check-pill" id="chkLower"><i class="fas fa-circle-dot"></i> Lowercase</span>
                    <span class="check-pill" id="chkDigits"><i class="fas fa-circle-dot"></i> Numbers</span>
                    <span class="check-pill" id="chkSymbols"><i class="fas fa-circle-dot"></i> Symbols</span>
                </div>

                <p id="feedbackText" class="feedback-text">Enter a password to evaluate strength.</p>
            </section>

            <div class="divider"></div>

            <!-- SECTION 2: GENERATOR -->
            <section class="card-section">
                <div class="section-header">
                    <h2><i class="fas fa-wand-magic-sparkles"></i> Password Generator</h2>
                </div>

                <!-- Output Box -->
                <div class="gen-output-box">
                    <input type="text" id="generatedPassword" readonly value="Generating...">
                    <div class="gen-actions">
                        <button type="button" id="copyGenBtn" class="btn-icon" title="Copy password">
                            <i class="fas fa-copy"></i>
                        </button>
                        <button type="button" id="regenerateBtn" class="btn-icon" title="Regenerate">
                            <i class="fas fa-arrows-rotate"></i>
                        </button>
                        <button type="button" id="useInAnalyzerBtn" class="btn-primary" title="Test in Analyzer">
                            Test in Analyzer
                        </button>
                    </div>
                </div>

                <!-- Controls -->
                <div class="gen-controls">
                    <div class="slider-row">
                        <label for="lengthSlider">Length: <strong id="lengthValue">16</strong></label>
                        <input type="range" id="lengthSlider" min="8" max="32" value="16" class="slider">
                    </div>

                    <div class="toggles-row">
                        <label class="toggle-pill">
                            <input type="checkbox" id="optUpper" checked>
                            <span>A-Z</span>
                        </label>
                        <label class="toggle-pill">
                            <input type="checkbox" id="optLower" checked>
                            <span>a-z</span>
                        </label>
                        <label class="toggle-pill">
                            <input type="checkbox" id="optDigits" checked>
                            <span>0-9</span>
                        </label>
                        <label class="toggle-pill">
                            <input type="checkbox" id="optSymbols" checked>
                            <span>!@#$</span>
                        </label>
                    </div>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <span>Client-side secure &bull; Zero credentials stored</span>
        </footer>
    </div>

    <!-- Minimal Toast -->
    <div id="toast" class="toast hidden">Copied to clipboard!</div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
